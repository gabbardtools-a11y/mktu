# МКТУ — Nginx reverse proxy для Next.js
# Этот файл создаётся автоматически скриптом install.sh
# Здесь — для ручной настройки, если что-то пошло не так

# HTTP (порт 80) — редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mktu.ru www.mktu.ru;  # ← ЗАМЕНИТЕ на ваш домен

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (порт 443) — основной сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mktu.ru www.mktu.ru;  # ← ЗАМЕНИТЕ на ваш домен

    # SSL сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mktu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mktu.ru/privkey.pem;

    # Настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Логи
    access_log /var/log/nginx/mktu-access.log;
    error_log  /var/log/nginx/mktu-error.log;

    client_max_body_size 50M;

    # Проксирование на Next.js контейнер
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Статика Next.js — кешируем на год
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
